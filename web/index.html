<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charr: a small C compiler.</title>
<meta name="description" content="Compile a subset of C in your browser and inspect pipeline stages: preprocessing, tokens, AST, IR and x86-64 assembly.">
<style>
:root {
  --bg: #eff2f4;
  --surface: #ffffff;
  --ink: #2e3d48;
  --muted: #4a6273;
  --line: #cfd8de;
  --accent: #e2622b;
  --accent-ink: #1b2329;
  --error: #b3261e;
  --error-bg: #fbe9e7;
  --code-bg: #f7f9fa;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b2329;
    --surface: #232d35;
    --ink: #e6ecef;
    --muted: #9db0bd;
    --line: #3a4852;
    --accent: #f0743a;
    --error: #ff8a80;
    --error-bg: #3a2422;
    --code-bg: #1e272d;
  }
}

* { box-sizing: border-box; }

html {
  height: 100%;
}

body {
  margin: 0;
  height: 100%;
  min-height: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 var(--sans);
  display: flex;
  flex-direction: column;
}

a {
  color: inherit;
  text-underline-offset: 2px;
}

:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

header {
  display: flex;
  align-items: baseline;
  gap: 1rem;
  padding: .9rem clamp(.75rem, 3vw, 1.5rem) .5rem;
}

header h1 {
  margin: 0;
  font-size: 1.6rem;
  letter-spacing: -.02em;
  flex: 0 0 auto;
}

header h1 span {
  color: var(--accent);
}

header p {
  margin: 0;
  color: var(--muted);
  flex: 1 1 auto;
  min-width: 0;
}

header nav {
  display: flex;
  gap: 1rem;
  flex: 0 0 auto;
  margin-left: auto;
}

header nav a {
  color: var(--muted);
  text-decoration: none;
}

header nav a:hover {
  color: var(--ink);
  text-decoration: underline;
}

.github-link {
  display: inline-flex;
  align-items: center;
  line-height: 0;
  border-radius: 4px;
}

.github-logo {
  display: block;
  width: 28px;
  height: 28px;
}

.github-logo-dark {
  display: none;
}

@media (prefers-color-scheme: dark) {
  .github-logo-light {
    display: none;
  }

  .github-logo-dark {
    display: block;
  }
}

main {
  flex: 1;
  min-height: 0;
  display: grid;
  gap: .9rem;
  padding: .5rem clamp(.75rem, 3vw, 1.5rem) 1rem;
  grid-template-columns: minmax(0, 1fr);
}

.mobile-tabs {
  display: none;
}

@media (max-width: 59.999rem) {
  .mobile-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .4rem;
    padding: .5rem clamp(.75rem, 3vw, 1.5rem) 0;
  }

  .mobile-tabs button[aria-selected="true"] {
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
    font-weight: 600;
  }

  .mobile-stage {
    display: block;
    font-weight: 600;
    flex: 1 1 auto;
    min-width: 0;
  }
}

@media (min-width: 60rem) {
  main {
    grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
    grid-template-rows: minmax(0, 1fr);
  }
}

.pane {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}

.pane-head {
  display: flex;
  align-items: center;
  gap: .6rem;
  flex-wrap: wrap;
  padding: .55rem .75rem;
  min-height: 3.4rem;
  border-bottom: 1px solid var(--line);
}

.pane-head h2 {
  margin: 0;
  font-size: 1rem;
  flex: 1 1 auto;
}

.output-head .pipeline {
  border: 0;
  padding: 0;
  min-width: 0;
  flex: 1 1 auto;
}

.mobile-stage {
  display: none;
}

label.inline {
  display: flex;
  align-items: center;
  gap: .35rem;
  font-size: .85rem;
  color: var(--muted);
}

input[type="text"] {
  font: inherit;
  font-family: var(--mono);
  font-size: .85rem;
  color: inherit;
  background: var(--code-bg);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: .3rem .5rem;
  width: 11rem;
}

button {
  font: inherit;
  color: inherit;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: .3rem .65rem;
  min-height: 2.1rem;
  cursor: pointer;
}

button:hover:not(:disabled) {
  border-color: var(--muted);
}

button:disabled {
  opacity: .5;
  cursor: default;
}

button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  font-weight: 600;
}

button.primary:hover:not(:disabled) {
  border-color: var(--accent);
  filter: brightness(1.05);
}

textarea#src {
  flex: 1;
  width: 100%;
  min-height: 0;
  resize: vertical;
  border: 0;
  border-radius: 0 0 6px 6px;
  padding: .75rem;
  background: var(--code-bg);
  color: var(--ink);
  font: 14px/1.5 var(--mono);
  tab-size: 4;
}

textarea#src:focus-visible {
  outline-offset: -3px;
}

@media (max-width: 59.999rem) {
  main.show-source .output-pane {
    display: none;
  }

  main.show-output .source-pane {
    display: none;
  }
}

.icon-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2.1rem;
  height: 2.1rem;
  padding: 0;
}

.icon-button svg {
  width: 1.1rem;
  height: 1.1rem;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Optimisations */

.optimisations {
  border-top: 1px solid var(--line);
  padding: .55rem .75rem .7rem;
}

.optimisations summary {
  cursor: pointer;
  font-weight: 600;
  font-size: .95rem;
}

.optimisations summary::marker {
  color: var(--muted);
}

.optimisations .opts {
  margin-top: .4rem;
}

.opts {
  display: flex;
  flex-wrap: wrap;
  gap: .25rem 1.25rem;
  margin-top: .3rem;
}

.opts label {
  display: flex;
  align-items: center;
  gap: .45rem;
  min-height: 2rem;
  cursor: pointer;
  font-size: .9rem;
}

.opts input {
  width: 1.1rem;
  height: 1.1rem;
  accent-color: var(--accent);
}

/* Compiler-stage pipeline */

.pipeline {
  list-style: none;
  margin: 0;
  padding: .6rem .75rem .5rem;
  display: flex;
  gap: 0;
  overflow-x: auto;
  border-bottom: 1px solid var(--line);
}

.pipeline li {
  display: flex;
  align-items: center;
  flex: 0 0 auto;
}

.pipeline li + li::before {
  content: "";
  width: 1rem;
  height: 2px;
  background: var(--line);
  flex: 0 0 auto;
}

.stage {
  border-radius: 999px;
  padding: .3rem .8rem;
  white-space: nowrap;
  border-color: var(--line);
}

.stage[aria-selected="true"] {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
  font-weight: 600;
}

.stage[data-status="skipped"] {
  color: var(--muted);
  border-style: dashed;
}

.stage[data-status="error"] {
  color: var(--error);
  border-color: var(--error);
}

.stage[data-status="error"]::before {
  content: "✕ ";
}

/* Output pane */

.output-wrap {
  position: relative;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

pre#out {
  flex: 1;
  min-height: 0;
  margin: 0;
  padding: .9rem;
  overflow: auto;
  background: var(--code-bg);
  font: 13px/1.55 var(--mono);
  white-space: pre;
}

pre#out.error {
  background: var(--error-bg);
  color: var(--error);
  white-space: pre-wrap;
}

.note {
  margin: 0;
  padding: .5rem .9rem;
  border-top: 1px solid var(--line);
  font-size: .82rem;
  color: var(--muted);
}

.note code {
  font-family: var(--mono);
  color: var(--ink);
}

.note:empty {
  display: none;
}

.note[hidden] {
  display: none;
}
</style>
</head>

<body>

<header>
  <h1>cha<span>rr</span></h1>
  <p>A small C compiler.</p>
  <nav>
    <a
      href="https://github.com/joshuanunn/charr"
      class="github-link"
      aria-label="View Charr on GitHub"
    >
      <img
        class="github-logo github-logo-light"
        src="GitHub_Invertocat_Black.svg"
        alt=""
        width="28"
        height="28"
      >
      <img
        class="github-logo github-logo-dark"
        src="GitHub_Invertocat_White.svg"
        alt=""
        width="28"
        height="28"
      >
    </a>
  </nav>
</header>

<div class="mobile-tabs" role="tablist" aria-label="Compiler panels">
  <button type="button" aria-selected="true" data-pane="source">
    Source
  </button>
  <button type="button" aria-selected="false" data-pane="output">
    Compiled
  </button>
</div>

<main>

  <section class="pane source-pane">
    <div class="pane-head">
      <h2>Source</h2>
      <label class="inline">
        -D
        <input type="text" id="defines" placeholder="DEBUG" spellcheck="false">
      </label>
    </div>

    <textarea id="src" spellcheck="false"></textarea>

  <details class="optimisations">
    <summary>Optimisations</summary>
      <div class="opts">
        <label>
          <input type="checkbox" class="opt" data-bit="1">
          Constant folding
        </label>
        <label>
          <input type="checkbox" class="opt" data-bit="2">
          Copy propagation
        </label>
        <label>
          <input type="checkbox" class="opt" data-bit="4">
          Unreachable code elim.
        </label>
        <label>
          <input type="checkbox" class="opt" data-bit="8">
          Dead store elim.
        </label>
      </div>
    </details>
  </section>

  <section class="pane output-pane">

    <div class="pane-head output-head">
      <span class="mobile-stage" id="mobile-stage">Preprocessed</span>

      <ol class="pipeline" id="tabs" role="tablist" aria-label="Compiler stages"></ol>

      <button id="copy" class="icon-button" disabled aria-label="Copy output" title="Copy output">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="9" width="10" height="10" rx="1.5"></rect>
          <path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"></path>
        </svg>
      </button>

      <button
        id="download"
        class="icon-button primary"
        disabled
        aria-label="Download assembly"
        title="Download assembly"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v12"></path>
          <path d="m7 10 5 5 5-5"></path>
          <path d="M5 20h14"></path>
        </svg>
      </button>

    </div>

    <div class="output-wrap">
      <pre id="out" role="tabpanel" tabindex="0"></pre>
      <p class="note" id="note"></p>
    </div>

  </section>

</main>

<script src="charr_web.bc.js?v=__COMMIT__"></script>

<script>
"use strict";

const STAGES = [
  { name: "preprocess",    label: "Preprocessed", mobile: "PP" },
  { name: "tokens",        label: "Tokens",       mobile: "TK" },
  { name: "ast",           label: "AST",           mobile: "AT" },
  { name: "validated_ast", label: "Typed AST",     mobile: "TY" },
  { name: "ir",            label: "IR",            mobile: "IR" },
  { name: "asm_ir",        label: "Assembly IR",   mobile: "AI" },
  { name: "asm",           label: "Assembly",      mobile: "AS" },
];

const $ = (id) => document.getElementById(id);

const srcEl = $("src");
const definesEl = $("defines");
const tabsEl = $("tabs");
const outEl = $("out");
const mobileStageEl = $("mobile-stage");
const noteEl = $("note");
const optEls = [...document.querySelectorAll(".opt")];

let results = null;
let tab = "asm";
let debounceId;

function currentOptFlags() {
  return optEls.reduce(
    (acc, el) => acc | (el.checked ? Number(el.dataset.bit) : 0),
    0
  );
}

function scheduleCompile() {
  clearTimeout(debounceId);
  debounceId = setTimeout(compile, 200);
}

function compile() {
  if (!window.charr) {
    return showFatal("The compiler failed to load.");
  }

  try {
    const stages = charr.compile(
      srcEl.value,
      definesEl.value,
      currentOptFlags()
    );

    results = Object.fromEntries(
      stages.map((s) => [s.name, s])
    );

    render();
  } catch (err) {
    showFatal(
      "Internal compiler error: " +
      (err && err.message ? err.message : err)
    );
  }
}

function buildTabs() {
  tabsEl.innerHTML = "";

  for (const s of STAGES) {
    const li = document.createElement("li");
    li.setAttribute("role", "presentation");

    const b = document.createElement("button");

    b.type = "button";
    b.className = "stage";
    b.id = "tab-" + s.name;
    b.setAttribute("role", "tab");
    b.dataset.stage = s.name;
    b.textContent = s.label;

    b.addEventListener("click", () => {
      tab = s.name;
      render();
    });

    li.appendChild(b);
    tabsEl.appendChild(li);
  }
}

function render() {
  outEl.classList.remove("error");

  for (const b of tabsEl.querySelectorAll("button")) {
    const st = results ? results[b.dataset.stage] : null;

    b.dataset.status = st
      ? st.status
      : "skipped";

    b.setAttribute(
      "aria-selected",
      String(b.dataset.stage === tab)
    );
  }

  outEl.setAttribute(
    "aria-labelledby",
    "tab-" + tab
  );

  const st = results && results[tab];
  let note = "";

  const selectedStage = STAGES.find((s) => s.name === tab);

  if (selectedStage) {
    mobileStageEl.textContent = selectedStage.label;
  }

  if (!st) {
    outEl.textContent = "";

  } else if (st.status === "done") {
    outEl.textContent = st.output;

    if (tab === "asm") {
      note = "x86-64 System V assembly (Linux). Assemble and link it with <code>gcc charr.s -o prog</code>.";
    }

  } else if (st.status === "error") {
    outEl.classList.add("error");
    outEl.textContent = st.output;

  } else {
    const failed = STAGES.find(
      (s) =>
        results[s.name] &&
        results[s.name].status === "error"
    );

    outEl.textContent = failed
      ? `Not reached: the "${failed.label}" stage reported an error.`
      : "";
  }

  noteEl.innerHTML = note;
  noteEl.hidden = !note;

  const asm = results && results.asm;

  $("download").disabled =
    !(asm && asm.status === "done");

  $("copy").disabled =
    !(st && st.status === "done");
}

function showFatal(message) {
  results = null;
  render();

  outEl.classList.add("error");
  outEl.textContent = message;
}

async function copyText(text, button, done) {
  const old = button.getAttribute("aria-label");

  try {
    await navigator.clipboard.writeText(text);
    button.setAttribute("aria-label", done);
    button.setAttribute("title", done);
  } catch (_) {
    button.setAttribute("aria-label", "Copy failed");
    button.setAttribute("title", "Copy failed");
  }

  setTimeout(() => {
    button.setAttribute("aria-label", old);
    button.setAttribute("title", old);
  }, 1200);
}

$("copy").addEventListener("click", () => {
  if (results && results[tab]) {
    copyText(
      results[tab].output,
      $("copy"),
      "Copied"
    );
  }
});

$("download").addEventListener("click", () => {
  const asm = results && results.asm;

  if (!asm || asm.status !== "done") {
    return;
  }

  const url = URL.createObjectURL(
    new Blob([asm.output], { type: "text/plain" })
  );

  const a = Object.assign(
    document.createElement("a"),
    {
      href: url,
      download: "charr.s"
    }
  );

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(
    () => URL.revokeObjectURL(url),
    1000
  );
});

srcEl.addEventListener("input", scheduleCompile);
definesEl.addEventListener("input", scheduleCompile);

optEls.forEach((el) =>
  el.addEventListener("change", scheduleCompile)
);

srcEl.value =
`/*
 * Computes the nth Fibonacci number recursively and returns
 * the result for n = 6 from main().
 */

int fib(int n) {
    if (n == 0 || n == 1) {
        return n;
    } else {
        return fib(n - 1) + fib(n - 2);
    }
}

int main(void) {
    int n = 6;
    return fib(n);
}
`;

const mobileTabs = document.querySelectorAll(".mobile-tabs button");

mobileTabs.forEach((button) => {
  button.addEventListener("click", () => {
    const pane = button.dataset.pane;

    document.querySelector("main").classList.toggle(
      "show-source",
      pane === "source"
    );

    document.querySelector("main").classList.toggle(
      "show-output",
      pane === "output"
    );

    mobileTabs.forEach((b) => {
      b.setAttribute(
        "aria-selected",
        String(b === button)
      );
    });
  });
});

document.querySelector("main").classList.add("show-source");

buildTabs();
compile();
</script>

</body>
</html>
