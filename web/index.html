<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charr: a small C compiler.</title>
<meta name="description" content="Compile a subset of C in your browser and inspect pipeline stages: preprocessing, tokens, AST, IR and x86-64 assembly.">
<style>
:root {
  --bg: #eff2f4;
  --surface: #ffffff;
  --ink: #2e3d48;
  --muted: #4a6273;
  --line: #cfd8de;
  --accent: #e2622b;
  --accent-ink: #1b2329;
  --error: #b3261e;
  --error-bg: #fbe9e7;
  --code-bg: #f7f9fa;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b2329;
    --surface: #232d35;
    --ink: #e6ecef;
    --muted: #9db0bd;
    --line: #3a4852;
    --accent: #f0743a;
    --error: #ff8a80;
    --error-bg: #3a2422;
    --code-bg: #1e272d;
  }
}

* { box-sizing: border-box; }

html {
  height: 100%;
}

body {
  margin: 0;
  height: 100%;
  min-height: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 var(--sans);
  display: flex;
  flex-direction: column;
}

a {
  color: inherit;
  text-underline-offset: 2px;
}

:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

header {
  display: flex;
  align-items: baseline;
  gap: 1rem;
  padding: .9rem clamp(.75rem, 3vw, 1.5rem) .5rem;
}

header h1 {
  margin: 0;
  font-size: 1.6rem;
  letter-spacing: -.02em;
  flex: 0 0 auto;
}

header h1 span {
  color: var(--accent);
}

header p {
  margin: 0;
  color: var(--muted);
  flex: 1 1 auto;
  min-width: 0;
}

header nav {
  display: flex;
  gap: 1rem;
  flex: 0 0 auto;
  margin-left: auto;
}

header nav a {
  color: var(--muted);
  text-decoration: none;
}

header nav a:hover {
  color: var(--ink);
  text-decoration: underline;
}

.github-link {
  display: inline-flex;
  align-items: center;
  line-height: 0;
  border-radius: 4px;
}

.github-logo {
  display: block;
  width: 28px;
  height: 28px;
}

.github-logo-dark {
  display: none;
}

@media (prefers-color-scheme: dark) {
  .github-logo-light {
    display: none;
  }

  .github-logo-dark {
    display: block;
  }
}

main {
  flex: 1;
  min-height: 0;
  display: grid;
  gap: .9rem;
  padding: .5rem clamp(.75rem, 3vw, 1.5rem) 1rem;
  grid-template-columns: minmax(0, 1fr);
}

.mobile-tabs {
  display: none;
}

@media (max-width: 59.999rem) {
  .mobile-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .4rem;
    padding: .5rem clamp(.75rem, 3vw, 1.5rem) 0;
  }

  .mobile-tabs button[aria-selected="true"] {
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
    font-weight: 600;
  }

  main.show-source .output-pane {
    display: none;
  }

  main.show-output .source-pane {
    display: none;
  }

  .pipeline {
    padding: 0;
  }

  .pipeline li + li::before {
    width: .6rem;
  }

  .pipeline .stage {
    padding: .25rem .55rem;
    min-width: 0;
  }

  .pipeline .stage::after {
    font-size: .9rem;
  }

  .source-head h2 {
    display: none;
  }
}

@media (min-width: 60rem) {
  main {
    grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
    grid-template-rows: minmax(0, 1fr);
  }
}

.pane {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}

.pane-head {
  display: flex;
  align-items: center;
  gap: .6rem;
  flex-wrap: wrap;
  padding: .55rem .75rem;
  min-height: 3.4rem;
  border-bottom: 1px solid var(--line);
}

.pane-head h2 {
  margin: 0;
  font-size: 1rem;
  flex: 1 1 auto;
}

.output-head {
  flex-wrap: nowrap;
}

.output-head .pipeline {
  border: 0;
  padding: 0;
  min-width: 0;
  flex: 1 1 0;
  overflow-x: auto;
  overflow-y: hidden;
}

label.inline {
  display: flex;
  align-items: center;
  gap: .35rem;
  font-size: .85rem;
  color: var(--muted);
}

input[type="text"] {
  font: inherit;
  font-family: var(--mono);
  font-size: .85rem;
  color: inherit;
  background: var(--code-bg);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: .3rem .5rem;
  width: 11rem;
}

button {
  font: inherit;
  color: inherit;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: .3rem .65rem;
  min-height: 2.1rem;
  cursor: pointer;
}

button:hover:not(:disabled) {
  border-color: var(--muted);
}

button:disabled {
  opacity: .5;
  cursor: default;
}

button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  font-weight: 600;
}

button.primary:hover:not(:disabled) {
  border-color: var(--accent);
  filter: brightness(1.05);
}

textarea#src {
  flex: 1;
  width: 100%;
  min-height: 0;
  resize: vertical;
  border: 0;
  border-radius: 0 0 6px 6px;
  padding: .75rem;
  background: var(--code-bg);
  color: var(--ink);
  font: 14px/1.5 var(--mono);
  tab-size: 4;
}

textarea#src:focus-visible {
  outline-offset: -3px;
}

.icon-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2.1rem;
  height: 2.1rem;
  padding: 0;
}

.icon-button svg {
  width: 1.1rem;
  height: 1.1rem;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.source-head {
  position: relative;
}

.optimise-button {
  flex: 0 0 auto;
}

.optimise-menu {
  position: absolute;
  z-index: 10;
  top: calc(100% + .35rem);
  right: .75rem;
  width: min(19rem, calc(100vw - 2rem));
  padding: .65rem .75rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  box-shadow: 0 4px 16px rgb(0 0 0 / .12);
  display: grid;
  gap: .35rem;
}

.optimise-menu[hidden] {
  display: none;
}

.optimise-menu strong {
  margin-bottom: .2rem;
  font-size: .9rem;
}

.optimise-menu label {
  display: flex;
  align-items: center;
  gap: .45rem;
  min-height: 2rem;
  cursor: pointer;
  font-size: .9rem;
}

.optimise-menu input {
  width: 1.1rem;
  height: 1.1rem;
  accent-color: var(--accent);
}

/* Compiler-stage pipeline */

.pipeline {
  list-style: none;
  margin: 0;
  padding: .6rem .75rem .5rem;
  display: flex;
  gap: 0;
  overflow-x: auto;
  border-bottom: 1px solid var(--line);
}

.pipeline li {
  display: flex;
  align-items: center;
  flex: 0 0 auto;
}

.pipeline li + li::before {
  content: "";
  width: 1rem;
  height: 2px;
  background: var(--line);
  flex: 0 0 auto;
}

.stage {
  border-radius: 999px;
  padding: .3rem .8rem;
  white-space: nowrap;
  border-color: var(--line);
}

.stage[aria-selected="true"] {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
  font-weight: 600;
}

.stage[data-status="skipped"] {
  color: var(--muted);
  border-style: dashed;
}

.stage[data-status="error"] {
  color: var(--error);
  border-color: var(--error);
}

.stage[data-status="error"]::before {
  content: "✕ ";
}

/* Output pane */

.output-wrap {
  position: relative;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

pre#out {
  flex: 1;
  min-height: 0;
  margin: 0;
  padding: .9rem;
  overflow: auto;
  background: var(--code-bg);
  font: 13px/1.55 var(--mono);
  white-space: pre;
}

pre#out.error {
  background: var(--error-bg);
  color: var(--error);
  white-space: pre-wrap;
}

.note {
  margin: 0;
  padding: .5rem .9rem;
  border-top: 1px solid var(--line);
  font-size: .82rem;
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .75rem;
}

.note-text {
  min-width: 0;
}

.note-actions {
  display: flex;
  align-items: center;
  gap: .4rem;
  flex: 0 0 auto;
}

.note code {
  font-family: var(--mono);
  color: var(--ink);
}

.note[hidden] {
  display: none;
}

/* AST tree view (shared by the "AST" and "Typed AST" tabs) */

:root {
  --ast-ctor: #a8500a;
  --ast-field: #35588a;
  --ast-leaf: #1c7a4d;
  --ast-badge-bg: #e7eef0;
  --ast-badge-text: #2c6e77;
  --ast-hi-bg: #ffe8a3;
  --ast-hi-text: #5a4400;
}

@media (prefers-color-scheme: dark) {
  :root {
    --ast-ctor: #e3a008;
    --ast-field: #7fa8d9;
    --ast-leaf: #6fcf97;
    --ast-badge-bg: #1f3a3d;
    --ast-badge-text: #6fd0da;
    --ast-hi-bg: #4a3b12;
    --ast-hi-text: #ffd479;
  }
}

.ast-toolbar {
  margin: 0;
  padding: .5rem .9rem;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: .5rem;
}

.ast-toolbar[hidden] {
  display: none;
}

.ast-tree {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: .6rem 0;
  background: var(--code-bg);
  font-family: var(--mono);
  font-size: .86rem;
  line-height: 1.65;
}

.ast-tree[hidden] {
  display: none;
}

.ast-row-head {
  display: flex;
  align-items: center;
  gap: .4rem;
  padding: .05rem .9rem .05rem 0;
  white-space: nowrap;
}

.ast-row-head[data-has-kids] {
  cursor: pointer;
}

.ast-row-head[data-has-kids]:hover {
  background: color-mix(in srgb, var(--ast-field) 8%, transparent);
}

.ast-row-head:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}

.ast-tri {
  width: 1em;
  text-align: center;
  color: var(--muted);
  transition: transform .12s ease;
  flex: none;
}

.ast-row:not(.ast-collapsed) > .ast-row-head .ast-tri {
  transform: rotate(90deg);
}

.ast-row.ast-collapsed > .ast-kids {
  display: none;
}

.ast-lbl.ast-ctor {
  color: var(--ast-ctor);
  font-weight: 600;
}

.ast-lbl.ast-field {
  color: var(--ast-field);
}

.ast-lbl.ast-leaf {
  color: var(--ast-leaf);
}

.ast-lbl.ast-ident {
  color: var(--ast-leaf);
  cursor: pointer;
  border-radius: 3px;
  padding: 0 .15em;
}

.ast-lbl.ast-ident.ast-hi {
  background: var(--ast-hi-bg);
  color: var(--ast-hi-text);
}

.ast-tree[data-highlight-idents="false"] .ast-lbl.ast-ident {
  cursor: default;
}

.ast-badge {
  font-size: .72rem;
  color: var(--ast-badge-text);
  background: var(--ast-badge-bg);
  border-radius: 4px;
  padding: .05rem .4rem;
}

.ast-kids {
  border-left: 1px solid var(--line);
  margin-left: .5em;
}

/* Token chip list (Tokens tab) */

.tok-list {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: .9rem;
  background: var(--code-bg);
  font: 13px var(--mono);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 3px;
}

.tok-list[hidden] {
  display: none;
}

.tok-chip {
  padding: 1px .45em 0px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--surface);
  line-height: 1.35;
  white-space: pre;
}

.tok-chip.tok-keyword {
  color: var(--ast-ctor);
  font-weight: 600;
}

.tok-chip.tok-ident {
  color: var(--ast-leaf);
}

.tok-chip.tok-literal {
  color: var(--ast-field);
}

.tok-chip.tok-punct {
  color: var(--muted);
}

/* Listing view (shared by the "IR" and "Asm IR" tabs) */

:root {
  --listing-reg: #8b3fa0;
}

@media (prefers-color-scheme: dark) {
  :root {
    --listing-reg: #d79ae8;
  }
}

.listing-view {
  flex: 1;
  min-height: 0;
  overflow: auto;
  background: var(--code-bg);
  font-family: var(--mono);
  font-size: 13px;
}

.listing-view[hidden] {
  display: none;
}

.listing-block {
  border-bottom: 1px solid var(--line);
}

.listing-block:last-child {
  border-bottom: none;
}

.listing-block-head {
  display: flex;
  align-items: center;
  gap: .4rem;
  padding: .4rem .9rem;
  cursor: pointer;
}

.listing-block-head:hover {
  background: color-mix(in srgb, var(--ast-field) 8%, transparent);
}

.listing-block-head:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}

.listing-block-name {
  font-weight: 600;
  color: var(--ast-ctor);
}

.listing-tri {
  width: 1em;
  text-align: center;
  color: var(--muted);
  transition: transform .12s ease;
  flex: none;
}

.listing-block:not(.listing-collapsed) .listing-tri {
  transform: rotate(90deg);
}

.listing-block.listing-collapsed .listing-rows {
  display: none;
}

.listing-rows {
  padding: .3rem 0 .6rem;
}

.listing-row {
  padding: .05rem 0 .05rem 2.1rem;
  white-space: pre;
  line-height: 1.5;
}

.listing-row.listing-label {
  padding-left: .9rem;
  color: var(--ast-ctor);
  font-weight: 600;
}

.listing-row.listing-flash {
  background: var(--ast-hi-bg);
  transition: background .2s ease;
}

.listing-mnemonic {
  font-weight: 600;
}

.listing-op {
  cursor: pointer;
  border-radius: 3px;
  padding: 0 .1em;
}

.listing-op.imm { color: var(--ast-field); }
.listing-op.var { color: var(--ast-leaf); }
.listing-op.reg { color: var(--listing-reg); }
.listing-op.mem { color: var(--muted); }

.listing-op.label_ref {
  color: var(--ast-ctor);
  text-decoration: underline dotted;
}

.listing-op.hi {
  background: var(--ast-hi-bg);
  color: var(--ast-hi-text);
}

select {
  font: inherit;
  color: inherit;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: .3rem .4rem;
  min-height: 2.1rem;
  width: 7.5rem;
  flex: 0 0 auto;
  cursor: pointer;
}

select:hover {
  border-color: var(--muted);
}
</style>
</head>

<body>

<header>
  <h1>cha<span>rr</span></h1>
  <p>A small C compiler.</p>
  <nav>
    <a
      href="https://github.com/joshuanunn/charr"
      class="github-link"
      aria-label="View Charr on GitHub"
    >
      <img
        class="github-logo github-logo-light"
        src="GitHub_Invertocat_Black.svg"
        alt=""
        width="28"
        height="28"
      >
      <img
        class="github-logo github-logo-dark"
        src="GitHub_Invertocat_White.svg"
        alt=""
        width="28"
        height="28"
      >
    </a>
  </nav>
</header>

<div class="mobile-tabs" role="tablist" aria-label="Compiler panels">
  <button type="button" aria-selected="true" data-pane="source">
    Source
  </button>
  <button type="button" aria-selected="false" data-pane="output" id="mobile-output-tab">
    Compiled
  </button>
</div>

<main>

  <section class="pane source-pane">
    
    <div class="pane-head source-head">
      <h2>Source</h2>

      <select id="examples" aria-label="Load an example program">
        <option value="">Examples</option>
      </select>

      <label class="inline">
        -D
        <input type="text" id="defines" placeholder="DEBUG" spellcheck="false">
      </label>

      <button
        type="button"
        id="optimise-button"
        class="optimise-button"
        aria-expanded="false"
        aria-controls="optimise-menu"
      >
        Optimise
      </button>

      <div
        id="optimise-menu"
        class="optimise-menu"
        hidden
      >
        <strong>Optimisations</strong>

        <label>
          <input type="checkbox" class="opt" data-bit="1">
          Constant folding
        </label>

        <label>
          <input type="checkbox" class="opt" data-bit="2">
          Copy propagation
        </label>

        <label>
          <input type="checkbox" class="opt" data-bit="4">
          Unreachable code elim.
        </label>

        <label>
          <input type="checkbox" class="opt" data-bit="8">
          Dead store elim.
        </label>
      </div>
    </div>

    <textarea id="src" spellcheck="false"></textarea>

  </section>

  <section class="pane output-pane">

    <div class="pane-head output-head">
      <ol class="pipeline" id="tabs" role="tablist" aria-label="Compiler stages"></ol>
    </div>

    <div class="output-wrap">
      <pre id="out" role="tabpanel" tabindex="0"></pre>
      <div class="ast-tree" id="astTree" role="tabpanel" tabindex="0" hidden></div>
      <div class="tok-list" id="tokList" role="tabpanel" tabindex="0" hidden></div>
      <div class="listing-view" id="listingView" role="tabpanel" tabindex="0" hidden></div>

      <div class="ast-toolbar" id="astToolbar" hidden>
        <button type="button" id="astExpandAll">Expand all</button>
        <button type="button" id="astCollapseAll">Collapse all</button>
      </div>

      <div class="note" id="note">
        <span class="note-text"></span>

        <span class="note-actions">
          <button id="copy" class="icon-button" disabled aria-label="Copy output" title="Copy output">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="9" width="10" height="10" rx="1.5"></rect>
              <path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>

          <button
            id="download"
            class="icon-button primary"
            disabled
            aria-label="Download assembly"
            title="Download assembly"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v12"></path>
              <path d="m7 10 5 5 5-5"></path>
              <path d="M5 20h14"></path>
            </svg>
          </button>
        </span>
      </div>
    </div>

  </section>

</main>

<script src="charr_web.bc.js?v=__COMMIT__"></script>

<script>
"use strict";

const STAGES = [
  { name: "preprocess",    label: "Preprocessed", mobile: "PP" },
  { name: "tokens",        label: "Tokens",       mobile: "TK" },
  { name: "ast",           label: "AST",           mobile: "AT" },
  { name: "validated_ast", label: "Typed AST",     mobile: "TY" },
  { name: "ir",            label: "IR",            mobile: "IR" },
  { name: "asm_ir",        label: "Assembly IR",   mobile: "AI" },
  { name: "asm",           label: "Assembly",      mobile: "AS" },
];

const $ = (id) => document.getElementById(id);

const srcEl = $("src");
const definesEl = $("defines");
const tabsEl = $("tabs");
const outEl = $("out");
const astTreeEl = $("astTree");
const tokListEl = $("tokList");
const listingEl = $("listingView");
const astToolbarEl = $("astToolbar");
const astExpandAllEl = $("astExpandAll");
const astCollapseAllEl = $("astCollapseAll");
const mobileOutputTabEl = $("mobile-output-tab");
const noteEl = $("note");
const optimiseButton = $("optimise-button");
const optimiseMenu = $("optimise-menu");
const optEls = [...document.querySelectorAll(".opt")];

optEls.forEach((el) => {
  el.checked = false;
});

let results = null;
let tab = "asm";
let debounceId;

const mobileMedia = window.matchMedia(
  "(max-width: 59.999rem)"
);

function currentOptFlags() {
  return optEls.reduce(
    (acc, el) => acc | (el.checked ? Number(el.dataset.bit) : 0),
    0
  );
}

function scheduleCompile() {
  clearTimeout(debounceId);
  debounceId = setTimeout(compile, 200);
}

function compile() {
  if (!window.charr) {
    return showFatal("The compiler failed to load.");
  }

  try {
    const stages = charr.compile(
      srcEl.value,
      definesEl.value,
      currentOptFlags()
    );

    results = Object.fromEntries(
      stages.map((s) => [s.name, s])
    );

    render();
  } catch (err) {
    showFatal(
      "Internal compiler error: " +
      (err && err.message ? err.message : err)
    );
  }
}

function buildTabs() {
  tabsEl.innerHTML = "";

  for (const s of STAGES) {
    const li = document.createElement("li");
    li.setAttribute("role", "presentation");

    const b = document.createElement("button");

    b.type = "button";
    b.className = "stage";
    b.id = "tab-" + s.name;
    b.setAttribute("role", "tab");
    b.setAttribute("aria-label", s.label);
    b.dataset.stage = s.name;

    b.addEventListener("click", () => {
      tab = s.name;
      render();
    });

    li.appendChild(b);
    tabsEl.appendChild(li);
  }

  updateStageTabLabels();
}

function updateStageTabLabels() {
  const mobile = mobileMedia.matches;

  for (const s of STAGES) {
    const button = document.getElementById("tab-" + s.name);

    if (!button) continue;

    button.textContent = mobile ? s.mobile : s.label;
    button.setAttribute("aria-label", s.label);
    button.title = s.label;
    button.setAttribute(
      "aria-selected",
      String(s.name === tab)
    );
  }
}

function astRowHasKids(node) {
  return !!(node.kids && node.kids.length);
}

function renderAstNode(node, depth) {
  const hasKids = astRowHasKids(node);
  const collapsedByDefault = hasKids && depth === 1;

  const row = document.createElement("div");
  row.className = "ast-row" + (collapsedByDefault ? " ast-collapsed" : "");

  const head = document.createElement("div");
  head.className = "ast-row-head";
  head.style.paddingLeft = depth * 16 + "px";

  if (hasKids) {
    head.dataset.hasKids = "1";
    head.tabIndex = 0;
    head.setAttribute("role", "button");
    head.setAttribute("aria-expanded", String(!collapsedByDefault));
  }

  const tri = document.createElement("span");
  tri.className = "ast-tri";
  tri.textContent = hasKids ? "\u25b8" : "";
  head.appendChild(tri);

  const lbl = document.createElement("span");
  lbl.className = "ast-lbl ast-" + node.cls;
  lbl.textContent = node.label;
  if (node.cls === "ident") {
    lbl.dataset.ident = node.label;
  }
  head.appendChild(lbl);

  if (node.sub) {
    const badge = document.createElement("span");
    badge.className = "ast-badge";
    badge.textContent = node.sub;
    head.appendChild(badge);
  }

  row.appendChild(head);

  if (hasKids) {
    const kids = document.createElement("div");
    kids.className = "ast-kids";
    node.kids.forEach((k) => kids.appendChild(renderAstNode(k, depth + 1)));
    row.appendChild(kids);
  }

  return row;
}

function buildAstTree(root, highlightIdents) {
  astTreeEl.innerHTML = "";
  astTreeEl.dataset.highlightIdents = String(!!highlightIdents);
  astTreeEl.appendChild(renderAstNode(root, 0));
}

function toggleAstRow(head) {
  const collapsed = head.parentElement.classList.toggle("ast-collapsed");
  head.setAttribute("aria-expanded", String(!collapsed));
}

astTreeEl.addEventListener("click", (e) => {
  const identEl = e.target.closest(".ast-lbl.ast-ident");

  if (identEl) {
    if (astTreeEl.dataset.highlightIdents !== "true") return;

    const name = identEl.dataset.ident;
    const turningOn = !identEl.classList.contains("ast-hi");

    astTreeEl.querySelectorAll(".ast-lbl.ast-ident").forEach((el) => {
      el.classList.toggle("ast-hi", turningOn && el.dataset.ident === name);
    });

    return;
  }

  const head = e.target.closest(".ast-row-head[data-has-kids]");
  if (head) {
    toggleAstRow(head);
  }
});

astTreeEl.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;

  const head = e.target.closest(".ast-row-head[data-has-kids]");
  if (head) {
    e.preventDefault();
    toggleAstRow(head);
  }
});

astExpandAllEl.addEventListener("click", () => {
  astTreeEl.querySelectorAll(".ast-row").forEach((r) => {
    r.classList.remove("ast-collapsed");
  });

  astTreeEl.querySelectorAll(".ast-row-head[data-has-kids]").forEach((h) => {
    h.setAttribute("aria-expanded", "true");
  });
});

astCollapseAllEl.addEventListener("click", () => {
  astTreeEl.querySelectorAll(".ast-row-head[data-has-kids]").forEach((h) => {
    h.parentElement.classList.add("ast-collapsed");
    h.setAttribute("aria-expanded", "false");
  });
});

// tokens: [{ cat, label }] from Token_view, cat is keyword|ident|literal|punct.
function buildTokenList(tokens) {
  const frag = document.createDocumentFragment();

  for (const tok of tokens) {
    const chip = document.createElement("div");
    chip.className = "tok-chip tok-" + tok.cat;
    chip.textContent = tok.label;
    frag.appendChild(chip);
  }

  tokListEl.replaceChildren(frag);
}

// blocks: [{ name, global, params, badge, rows }] from Listing_view, shared
// by the IR and Asm IR tabs. rows: [{ rowKind: "instr"|"label", mnemonic,
// badge, ops, result, text }]. ops/params: [{ kind, text }], kind is
// imm|var|reg|mem|label_ref.
function renderListingOp(op) {
  const span = document.createElement("span");
  span.className = "listing-op " + op.kind;
  span.dataset.opKind = op.kind;

  if (op.kind === "label_ref") {
    span.textContent = "." + op.text;
    span.dataset.jump = op.text;
  } else {
    span.textContent = op.text;
    span.dataset.name = op.text;
  }

  return span;
}

function appendOps(container, ops, sep) {
  ops.forEach((op, i) => {
    if (i > 0) container.appendChild(document.createTextNode(sep));
    container.appendChild(renderListingOp(op));
  });
}

function appendBadge(container, text) {
  container.appendChild(document.createTextNode(" "));
  const badge = document.createElement("span");
  badge.className = "ast-badge";
  badge.textContent = text;
  container.appendChild(badge);
}

function renderListingRow(row) {
  const div = document.createElement("div");

  if (row.rowKind === "label") {
    div.className = "listing-row listing-label";
    div.textContent = "." + row.text + ":";
    div.dataset.label = row.text;
    return div;
  }

  div.className = "listing-row";

  const mnem = document.createElement("span");
  mnem.className = "listing-mnemonic";
  mnem.textContent = row.mnemonic;
  div.appendChild(mnem);

  if (row.badge) appendBadge(div, row.badge);

  if (row.ops && row.ops.length) {
    div.appendChild(document.createTextNode("  "));
    appendOps(div, row.ops, ", ");
  }

  if (row.result) {
    div.appendChild(
      document.createTextNode(row.ops && row.ops.length ? " -> " : "  -> ")
    );
    div.appendChild(renderListingOp(row.result));
  }

  return div;
}

function renderListingBlock(block) {
  const wrap = document.createElement("div");
  wrap.className = "listing-block";

  const head = document.createElement("div");
  head.className = "listing-block-head";
  head.tabIndex = 0;
  head.setAttribute("role", "button");
  head.setAttribute("aria-expanded", "true");

  const tri = document.createElement("span");
  tri.className = "listing-tri";
  tri.textContent = "\u25b8";
  head.appendChild(tri);

  const name = document.createElement("span");
  name.className = "listing-block-name";
  name.textContent = block.name;
  head.appendChild(name);

  if (block.params.length) {
    head.appendChild(document.createTextNode("("));
    appendOps(head, block.params, ", ");
    head.appendChild(document.createTextNode(")"));
  }

  if (block.global) appendBadge(head, "global");
  if (block.badge) appendBadge(head, block.badge);

  wrap.appendChild(head);

  const rows = document.createElement("div");
  rows.className = "listing-rows";
  block.rows.forEach((r) => rows.appendChild(renderListingRow(r)));
  wrap.appendChild(rows);

  return wrap;
}

function buildListing(blocks) {
  listingEl.replaceChildren(...blocks.map(renderListingBlock));
}

function toggleListingBlock(head) {
  const collapsed = head.parentElement.classList.toggle("listing-collapsed");
  head.setAttribute("aria-expanded", String(!collapsed));
}

listingEl.addEventListener("click", (e) => {
  const jumpEl = e.target.closest(".listing-op.label_ref");

  if (jumpEl) {
    const block = jumpEl.closest(".listing-block");
    const label = block.querySelector(
      `.listing-row.listing-label[data-label="${CSS.escape(jumpEl.dataset.jump)}"]`
    );

    if (label) {
      label.scrollIntoView({ block: "center" });
      label.classList.add("listing-flash");
      setTimeout(() => label.classList.remove("listing-flash"), 700);
    }

    return;
  }

  const opEl = e.target.closest(".listing-op[data-name]");

  if (opEl) {
    const block = opEl.closest(".listing-block");
    const kind = opEl.dataset.opKind;
    const name = opEl.dataset.name;
    const turningOn = !opEl.classList.contains("hi");

    block.querySelectorAll(".listing-op[data-name]").forEach((el) => {
      el.classList.toggle(
        "hi",
        turningOn && el.dataset.opKind === kind && el.dataset.name === name
      );
    });

    return;
  }

  const head = e.target.closest(".listing-block-head");
  if (head) toggleListingBlock(head);
});

listingEl.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;

  const head = e.target.closest(".listing-block-head");
  if (head) {
    e.preventDefault();
    toggleListingBlock(head);
  }
});

function render() {
  outEl.classList.remove("error");

  for (const b of tabsEl.querySelectorAll("button")) {
    const st = results ? results[b.dataset.stage] : null;

    b.dataset.status = st
      ? st.status
      : "skipped";

    b.setAttribute(
      "aria-selected",
      String(b.dataset.stage === tab)
    );
  }

  outEl.setAttribute(
    "aria-labelledby",
    "tab-" + tab
  );

  astTreeEl.setAttribute(
    "aria-labelledby",
    "tab-" + tab
  );

  tokListEl.setAttribute(
    "aria-labelledby",
    "tab-" + tab
  );

  listingEl.setAttribute(
    "aria-labelledby",
    "tab-" + tab
  );

  const st = results && results[tab];
  const asm = results && results.asm;
  const isAsm = tab === "asm";
  const hasAsm = asm && asm.status === "done";
  const hasTree =
    (tab === "ast" || tab === "validated_ast") && st && st.status === "done" && st.tree;
  const hasTokens =
    tab === "tokens" && st && st.status === "done" && st.tokens;
  const hasListing =
    (tab === "ir" || tab === "asm_ir") && st && st.status === "done" && st.listing;

  let note = "";

  const selectedStage = STAGES.find((s) => s.name === tab);

  if (selectedStage) {
    mobileOutputTabEl.textContent = selectedStage.label;
  }

  if (!st) {
    outEl.textContent = "";

  } else if (st.status === "done") {
    outEl.textContent = st.output;

    if (isAsm) {
      note =
        "x86-64 System V assembly (Linux). Assemble and link it with <code>gcc charr.s -o prog</code>.";
    }

  } else if (st.status === "error") {
    outEl.classList.add("error");
    outEl.textContent = st.output;

  } else {
    const failed = STAGES.find(
      (s) =>
        results[s.name] &&
        results[s.name].status === "error"
    );

    outEl.textContent = failed
      ? `Not reached: the "${failed.label}" stage reported an error.`
      : "";
  }

  astToolbarEl.hidden = !hasTree;
  astTreeEl.hidden = !hasTree;
  tokListEl.hidden = !hasTokens;
  listingEl.hidden = !hasListing;
  outEl.hidden = !!(hasTree || hasTokens || hasListing);

  if (hasTree) {
    buildAstTree(st.tree, tab === "validated_ast");
  }

  if (hasTokens) {
    buildTokenList(st.tokens);
  }

  if (hasListing) {
    buildListing(st.listing);
  }

  noteEl.querySelector(".note-text").innerHTML = note;
  noteEl.hidden = !(isAsm && hasAsm);

  $("download").disabled = !hasAsm;
  $("copy").disabled = !(st && st.status === "done");
}

function showFatal(message) {
  results = null;
  render();

  outEl.classList.add("error");
  outEl.textContent = message;
}

async function copyText(text, button, done) {
  const old = button.getAttribute("aria-label");

  try {
    await navigator.clipboard.writeText(text);
    button.setAttribute("aria-label", done);
    button.setAttribute("title", done);
  } catch (_) {
    button.setAttribute("aria-label", "Copy failed");
    button.setAttribute("title", "Copy failed");
  }

  setTimeout(() => {
    button.setAttribute("aria-label", old);
    button.setAttribute("title", old);
  }, 1200);
}

$("copy").addEventListener("click", () => {
  if (results && results[tab]) {
    copyText(
      results[tab].output,
      $("copy"),
      "Copied"
    );
  }
});

$("download").addEventListener("click", () => {
  const asm = results && results.asm;

  if (!asm || asm.status !== "done") {
    return;
  }

  const url = URL.createObjectURL(
    new Blob([asm.output], { type: "text/plain" })
  );

  const a = Object.assign(
    document.createElement("a"),
    {
      href: url,
      download: "charr.s"
    }
  );

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(
    () => URL.revokeObjectURL(url),
    1000
  );
});

mobileMedia.addEventListener(
  "change",
  updateStageTabLabels
);

srcEl.addEventListener("input", scheduleCompile);
definesEl.addEventListener("input", scheduleCompile);

optEls.forEach((el) =>
  el.addEventListener("change", scheduleCompile)
);

const EXAMPLES = [
  { label: "Fibonacci", code: `/*
 * Computes the nth Fibonacci number recursively.
 *
 * Example returns the result for n = 6 from main().
 */

int fib(int n) {
    if (n == 0 || n == 1) {
        return n;
    } else {
        return fib(n - 1) + fib(n - 2);
    }
}

int main(void) {
    return fib(6);  // Returns 8
}
` },
  { label: "GCD (Euclid's algorithm)", code: `/*
 * Greatest common divisor of two positive integers, using Euclid's
 * algorithm.
 * 
 * Example returns the result for (a = 1071, b = 462) from main().
 */

int gcd(int a, int b) {
    if (a < 0) a = -a;
    if (b < 0) b = -b;

    while (b != 0) {
        int t = b;
        b = a % b;
        a = t;
    }
    return a;
}

int main(void) {
    return gcd(1071, 462);  // Returns 21
}
` },
  { label: "Optimisation", code: `/*
 * Try the Optimise menu and watch the IR/Assembly output simplify.
 */

int main(void) {
    int a = 3 + 6 * 3;
    int b = a / 21;
    int unused = a * 100;

    if (b - 1) {
        return 7;  // Should never return
    }
    return 2 * a;  // Returns 42
}
` },
  { label: "Popcount", code: `/*
 * Population count: count the number of bits set in a 64-bit value.
 *
 * Each pass adds the lowest bit of x to count, then shifts x right
 * by one, until x is 0. Example of ~0ul is all 64 bits set.
 */

int popcount(unsigned long x) {
    int count = 0;
    while (x) {
        count += (int) (x & 1);
        x >>= 1;
    }
    return count;
}

int main(void) {
    return popcount(~0ul);  // Returns 64
}
` },
  { label: "Function arguments", code: `/*
 * The System V AMD64 calling convention.
 *
 * The rules defining how Linux expects function arguments and return
 * values to be passed in function calls, so separately compiled code
 * can interoperate.
 *
 * Integer arguments:
 *   - The first six (here: a-f) go in registers, in this order:
 *         rdi, rsi, rdx, rcx, r8, r9
 *     (an int uses the low 32 bits: edi, esi, edx, ecx, r8d, r9d).
 *   - The seventh (here: g) and later go on the stack, pushed right
 *     to left, so the seventh argument is at the lowest address.
 *
 * Look in the Assembly tab:
 *   - In main: the six register arguments are loaded (edi ... r9d),
 *     then 7 is pushed, then a call.
 *   - In main: you should see "subq $8, %rsp" before the arguments,
 *     which is padding to satisfy the alignment rule below.
 *   - In sum: the register arguments are first copied to stack slots
 *     (-4(%rbp), -8(%rbp), ..). The stack argument g is read from
 *     16(%rbp). The saved rbp is stored at offset 0 (from rbp), the
 *     return address at offset 8 and stack arguments from offset 16.
 *
 * Other points:
 *   - Return value: an int returns in eax (rax for larger values).
 *   - rsp must be a multiple of 16 bytes before a call. For a single
 *     8-byte arg passed via stack (pushq), the compiler first pads
 *     by 8 bytes. Even numbers of stack arguments need no padding.
 *   - Caller removes stack arguments after return. Here main adds 16
 *     to rsp, which discards the 8-byte argument and 8-byte padding.
 *
 * Try:
 *   - Add an eighth argument and the padding should disappear.
 *   - Drop to six or fewer arguments and nothing should be pushed.
 */

int sum(int a, int b, int c, int d, int e, int f, int g) {
    return a + b + c + d + e + f + g;
}

int main(void) {
    return sum(1, 2, 3, 4, 5, 6, 7);  // Returns 28
}
` },
  { label: "Linkage and storage", code: `/*
 * Linkage and storage duration (extern and static storage-class
 * specifiers).
 *
 * Linkage (name visibility in other translation units):
 *   - External (default at file scope): total, limit and main. Here
 *     limit is declared extern before its definition later on.
 *   - Internal ("static" at file scope): scale and add.
 *
 * Storage duration (object lifetime):
 *   - Static: total, scale, limit and runs exist for the lifetime of
 *     the program. Here runs is a static local, so it retains its
 *     value between calls, but is only visible inside add.
 *   - Automatic: x and n exist only during the call (on the stack).
 */

extern int limit;

int total = 10;
static int scale = 2;

static int add(int x) {
    static int runs = 0;
    runs += 1;
    total += x * scale;
    return runs;
}

int main(void) {
    int n;
    add(1);
    add(2);
    n = add(3);
    return n + total + limit;  // Returns 29
}

int limit = 4;
` },
];

const examplesEl = $("examples");
let loadedExample = EXAMPLES[0].code;
srcEl.value = loadedExample;

EXAMPLES.forEach((ex, i) => examplesEl.add(new Option(ex.label, i)));

examplesEl.addEventListener("change", () => {
  const ex = EXAMPLES[Number(examplesEl.value)];
  examplesEl.value = "";
  if (!ex) return;

  const dirty = srcEl.value.trim() && srcEl.value !== loadedExample;
  if (dirty && !confirm("Replace your code with this example?")) return;

  srcEl.value = loadedExample = ex.code;
  compile();
});

optimiseButton.addEventListener("click", () => {
  const open = optimiseMenu.hidden;

  optimiseMenu.hidden = !open;
  optimiseButton.setAttribute(
    "aria-expanded",
    String(open)
  );
});

document.addEventListener("click", (event) => {
  if (
    !optimiseMenu.hidden &&
    !optimiseMenu.contains(event.target) &&
    !optimiseButton.contains(event.target)
  ) {
    optimiseMenu.hidden = true;
    optimiseButton.setAttribute("aria-expanded", "false");
  }
});

const mobileTabs = document.querySelectorAll(".mobile-tabs button");

mobileTabs.forEach((button) => {
  button.addEventListener("click", () => {
    const pane = button.dataset.pane;

    document.querySelector("main").classList.toggle(
      "show-source",
      pane === "source"
    );

    document.querySelector("main").classList.toggle(
      "show-output",
      pane === "output"
    );

    mobileTabs.forEach((b) => {
      b.setAttribute(
        "aria-selected",
        String(b === button)
      );
    });
  });
});

document.querySelector("main").classList.add("show-source");

buildTabs();
compile();
</script>
